# Frontend nginx — serves the static site on :80 INSIDE the docker network only.
# TLS + public :443 are handled by the Caddy reverse proxy in front (see
# docker-compose). Caddy routes / -> this container and /ws -> the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Correct MIME type for ES modules.
    location ~* \.js$ {
        add_header Content-Type application/javascript;
    }
}
