<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSGO - Multiplayer FPS</title>
    <link rel="icon" type="image/png" href="models/logo.png">
    <link rel="apple-touch-icon" href="models/logo.png">

    <!-- Self-hosted Umami analytics (same as the landing page) so the game can fire
         custom events (match-started, match-finished). -->
    <script defer src="https://analytics.rsgo.io/script.js"
            data-website-id="cf7ed771-0cd4-4b7b-a25c-2e31f898a0a8"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        function checkMapBuilderMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const mapBuilder = urlParams.get('mapbuilder');
            const hash = window.location.hash;
            
            return mapBuilder === 'orange' || hash === '#mapbuilder' || window.location.pathname.includes('mapbuilder');
        }

        window.isMapBuilderMode = checkMapBuilderMode();
        
        if (window.isMapBuilderMode) {
            console.log('🗺️ Map Builder Mode Detected - Hiding UI!');
        }
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            /* logo cursor (32x32 png), hotspot centred at 16,16 — same as website */
            cursor: url("models/rsgo-cursor.png") 16 16, crosshair;
        }
        a, button, [role="button"], input {
            cursor: url("models/rsgo-cursor.png") 16 16, pointer;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: none; /* Hide the player count UI */
        }
        .ui-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            min-width: 120px;
        }
        .ui-value {
            color: #00ff88;
            font-size: 16px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* RSGO logo reticle as the crosshair (same asset as the site cursor) */
            width: 16px;
            height: 16px;
            background: url("models/rsgo-cursor.png") center / contain no-repeat;
            pointer-events: none;
            z-index: 100;
        }
        
        #deathmatchButton:hover {
            background: #3a6b42 !important;
            border-color: #5db96a !important;
            transform: translateY(-2px);
        }

        #teamVsTeamButton:hover {
            background: #ff7b45 !important;
            border-color: #ff8c32 !important;
            transform: translateY(-2px);
        }

        /* ===== RSGO onboarding flow — NAVY-dominant, orange as a sparing accent ===
           Text/inputs/borders use a light "ink" tone so the orange cursor stays
           clearly visible; orange is reserved for the primary CTA + focus accents. */
        :root {
            --navy:       #1a2447;   /* base background */
            --navy-deep:  #131a36;   /* deeper panel navy */
            --navy-soft:  #232f57;   /* raised surfaces / input fields */
            --orange:     #ef4e23;   /* accent only */
            --ink:        #e8edff;   /* primary light text */
            --ink-dim:    #9fb0d8;   /* secondary / muted text */
            --line:       rgba(159,176,216,0.22); /* subtle borders */
        }
        /* Navy gradient background, LIGHT text by default. */
        .rsgo-screen {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            background: radial-gradient(120% 120% at 50% 0%, var(--navy) 0%, var(--navy-deep) 100%);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .rsgo-screen.show { display: flex; animation: rsgoFade 0.5s ease both; }
        .rsgo-screen.leaving { animation: rsgoFadeOut 0.4s ease both; }
        @keyframes rsgoFade   { from { opacity: 0; } to { opacity: 1; } }
        @keyframes rsgoFadeOut{ from { opacity: 1; } to { opacity: 0; } }
        @keyframes rsgoRise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .rsgo-card { width: min(92vw, 780px); padding: 8px; }
        .rsgo-rise { animation: rsgoRise 0.5s ease both; }
        .rsgo-rise.d1 { animation-delay: 0.05s; }
        .rsgo-rise.d2 { animation-delay: 0.14s; }
        .rsgo-rise.d3 { animation-delay: 0.24s; }

        .rsgo-kicker {
            font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
            color: var(--orange); font-weight: 600; margin-bottom: 10px;
        }
        .rsgo-title { font-size: clamp(28px, 5vw, 46px); font-weight: 700; line-height: 1.05; margin: 0 0 6px; color: var(--ink); }
        .rsgo-sub   { color: var(--ink-dim); font-size: 15px; margin-bottom: 30px; }

        /* Input: soft navy field, subtle border, light text — orange only on focus. */
        .rsgo-input {
            width: 100%; box-sizing: border-box; padding: 16px 18px;
            background: var(--navy-soft);
            border: 1.5px solid var(--line);
            border-radius: 12px; color: var(--ink); font-size: 18px; font-family: inherit;
            outline: none; transition: box-shadow 0.2s, border-color 0.2s;
        }
        .rsgo-input::placeholder { color: var(--ink-dim); opacity: 0.6; }
        .rsgo-input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(239, 78, 35, 0.18); }

        /* Primary button: ORANGE fill, NAVY text. */
        .rsgo-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 30px; border: 2px solid var(--orange); border-radius: 12px;
            background: var(--orange); color: var(--navy); font-family: inherit;
            font-size: 16px; font-weight: 700; cursor: url("models/rsgo-cursor.png") 16 16, pointer;
            transition: transform 0.15s ease, background 0.2s, color 0.2s;
        }
        .rsgo-btn:hover  { transform: translateY(-2px); }
        .rsgo-btn:active { transform: translateY(0); }
        /* Disabled: hollow — navy fill, orange outline/text. */
        .rsgo-btn:disabled { background: var(--navy); color: var(--orange); opacity: 0.5; cursor: url("models/rsgo-cursor.png") 16 16, default; transform: none; }

        /* ===== Minimalist name + loader ===== */
        .rsgo-name-card, .rsgo-load-card {
            width: min(90vw, 440px); text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Small spaced wordmark, the only chrome. */
        .rsgo-wordmark {
            font-size: 13px; font-weight: 700; letter-spacing: 8px;
            color: var(--ink-dim); opacity: 0.8; margin-bottom: 48px;
            padding-left: 8px; /* visually balance the letter-spacing */
        }
        /* Logo image used in place of the wordmark on the name screen. */
        .rsgo-logo-mark { width: 64px; height: 64px; object-fit: contain; margin-bottom: 40px; }

        /* ---- Minimal brand mark on the name screen ---- */
        .rsgo-brand { margin-bottom: clamp(44px, 8vh, 72px); }
        .rsgo-brand-word {
            font-size: clamp(34px, 6vw, 52px); font-weight: 800;
            letter-spacing: 7px; color: var(--ink); line-height: 1;
            padding-left: 7px; /* balance the tracking */
        }
        .rsgo-brand-dot {
            color: var(--orange);
            /* subtle breathing accent so the mark feels alive */
            animation: rsgoDot 2.4s ease-in-out infinite;
        }
        @keyframes rsgoDot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* ---- Clean underline input, centered, no box ---- */
        .rsgo-namefield {
            display: flex; align-items: center; gap: 14px;
            width: 100%; border-bottom: 1.5px solid var(--line);
            padding-bottom: 12px; transition: border-color 0.25s;
        }
        .rsgo-namefield:focus-within { border-color: var(--orange); }
        .rsgo-underline-input {
            flex: 1; background: none; border: none; outline: none;
            color: var(--ink); font-family: inherit; font-weight: 500;
            font-size: clamp(22px, 4.5vw, 32px); letter-spacing: 0.5px; min-width: 0;
        }
        .rsgo-underline-input::placeholder { color: var(--ink-dim); opacity: 0.4; font-weight: 400; }

        /* (legacy hint styles kept harmless in case markup references them) */
        .rsgo-enter-hint { display: none; }
        .rsgo-enter-hint kbd {
            font-family: inherit; font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 6px; margin: 0 2px;
            background: var(--navy-soft); border: 1px solid var(--line); color: var(--ink);
        }
        /* Inline circular arrow submit. */
        .rsgo-arrow {
            flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
            border: 1.5px solid var(--line); background: var(--navy-soft); color: var(--ink-dim);
            font-size: 22px; font-weight: 700; cursor: url("models/rsgo-cursor.png") 16 16, pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.5; transform: scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease, background 0.25s, color 0.25s, border-color 0.25s;
        }
        /* Arrow activates once a name is typed (JS toggles .ready): orange ring +
           orange glyph on navy, so it stands out without an orange fill. */
        .rsgo-arrow.ready {
            opacity: 1; transform: scale(1);
            border-color: var(--orange); color: var(--orange); background: var(--navy-soft);
        }
        .rsgo-arrow.ready:hover { transform: scale(1.1); background: rgba(239,78,35,0.12); }

        .rsgo-hint {
            margin-top: 20px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--ink-dim); opacity: 0.6;
        }

        /* Thin minimalist loading bar (indeterminate sweep). */
        .rsgo-load-card .rsgo-wordmark { margin-bottom: 34px; }
        .rsgo-loadbar {
            width: 220px; height: 2px; background: rgba(159,176,216,0.18);
            border-radius: 2px; overflow: hidden; position: relative;
        }
        .rsgo-loadbar-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 40%;
            background: var(--orange); border-radius: 2px;
            animation: rsgoSweep 1.1s ease-in-out infinite;
        }
        @keyframes rsgoSweep {
            0%   { left: -40%; } 100% { left: 100%; }
        }
        .rsgo-load-card .rsgo-hint { margin-top: 22px; }

        /* Loader: orange ring on navy. */
        .rsgo-loader-ring {
            width: 64px; height: 64px; margin: 0 auto 28px;
            border: 3px solid rgba(239, 78, 35, 0.25);
            border-top-color: var(--orange); border-radius: 50%;
            animation: rsgoSpin 0.9s linear infinite;
        }
        @keyframes rsgoSpin { to { transform: rotate(360deg); } }
        .rsgo-steps { list-style: none; padding: 0; margin: 24px auto 0; max-width: 320px; text-align: left; }
        .rsgo-steps li {
            display: flex; align-items: center; gap: 12px; padding: 9px 0;
            color: var(--ink-dim); opacity: 0.5; font-size: 15px; transition: opacity 0.3s;
        }
        .rsgo-steps li .dot {
            width: 9px; height: 9px; border-radius: 50%;
            border: 1.5px solid var(--ink-dim); background: transparent; transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .rsgo-steps li.done   { opacity: 0.85; color: var(--ink); }
        .rsgo-steps li.done .dot { background: var(--orange); border-color: var(--orange); }
        .rsgo-steps li.active { opacity: 1; color: var(--ink); }
        .rsgo-steps li.active .dot { background: var(--orange); border-color: var(--orange); animation: rsgoPulse 0.9s ease infinite; }
        @keyframes rsgoPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,78,35,0.6);} 50% { box-shadow: 0 0 0 6px rgba(239,78,35,0);} }

        /* ===== Team select: full-bleed split where each side owns its color =====
           Left half breathes warm ORANGE, right half stays cool steel-NAVY. Each
           carries a giant ghosted index numeral, an accent top bar, and — on hover /
           selection — its accent color blooms up from the base of the half. */
        .rsgo-split { padding: 0; align-items: stretch; }     /* halves fill the screen */
        .rsgo-half {
            flex: 1; display: flex; align-items: center; justify-content: center;
            cursor: url("models/rsgo-cursor.png") 16 16, pointer; position: relative;
            overflow: hidden; color: var(--ink);
            transition: filter 0.25s ease, background 0.3s ease;
        }
        /* ORANGE side: warm base + an orange glow rising from the bottom. */
        .team-orange {
            --accent: var(--orange);
            background:
                radial-gradient(120% 80% at 50% 118%, rgba(239,78,35,0.28) 0%, transparent 60%),
                linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
        }
        /* NAVY side: cool steel-blue accent + a matching cool glow. */
        .team-navy {
            --accent: #5b8dd6;
            background:
                radial-gradient(120% 80% at 50% 118%, rgba(91,141,214,0.24) 0%, transparent 60%),
                linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
        }
        /* Accent bar along the top edge = team color signature. */
        .rsgo-half::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent); box-shadow: 0 0 18px var(--accent);
            opacity: 0.9;
        }
        /* Giant ghosted index numeral in the corner. */
        .half-ghost {
            position: absolute; bottom: -3vh; font-size: 34vh; line-height: 0.8;
            font-weight: 900; color: var(--accent); opacity: 0.06;
            pointer-events: none; user-select: none; letter-spacing: -0.04em;
            transition: opacity 0.3s ease;
        }
        .team-orange .half-ghost { left: 3vw; }
        .team-navy   .half-ghost { right: 3vw; }

        /* Center seam. */
        .team-orange::after {
            content: ''; position: absolute; top: 14%; bottom: 14%; right: 0; width: 1px;
            background: var(--line); z-index: 2;
        }

        /* Hover: accent blooms, numeral brightens. */
        .rsgo-half:hover { filter: brightness(1.12); }
        .rsgo-half:hover .half-ghost { opacity: 0.11; }
        /* When one side is picked, the other dims back. */
        .rsgo-split.has-pick .rsgo-half:not(.selected) { filter: brightness(0.5) saturate(0.55); }
        /* The picked half glows from within instead of getting a hard outline box. */
        .rsgo-half.selected { box-shadow: inset 0 0 140px -40px var(--accent); }
        .rsgo-half.selected .half-ghost { opacity: 0.16; }
        .rsgo-half.selected .half-name {
            text-shadow: 0 0 34px color-mix(in srgb, var(--accent) 70%, transparent);
        }

        /* Small centered prompt hovering over the seam. */
        .rsgo-split-prompt {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            z-index: 4; font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
            font-weight: 600; color: var(--ink-dim); opacity: 0.7;
        }
        .rsgo-split.has-pick .rsgo-split-prompt { opacity: 0; }

        .half-inner { position: relative; z-index: 2; width: 80%; max-width: 360px; text-align: center; }
        .half-name {
            font-size: clamp(30px, 4.4vw, 48px); font-weight: 800; letter-spacing: 5px;
            margin-bottom: 22px; color: var(--accent);
            text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .half-roster { display: flex; flex-direction: column; gap: 8px; min-height: 60px; align-items: center; }
        /* Player chips: soft navy surface + light text. "You" chip carries the accent. */
        .roster-chip {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
            animation: rsgoRise 0.35s ease both;
            background: var(--navy-soft); color: var(--ink);
            border: 1px solid var(--line);
        }
        .roster-chip.you {
            background: color-mix(in srgb, var(--accent) 16%, var(--navy-soft));
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            color: var(--ink);
        }
        /* Accent dot marker before every player. */
        .roster-chip::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); flex: 0 0 auto; opacity: 0.7;
        }
        .roster-chip.you::before { opacity: 1; box-shadow: 0 0 8px var(--accent); }
        .roster-chip.you::after { content: 'you'; font-size: 11px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
        .half-empty { font-size: 14px; padding: 10px; font-weight: 500; color: var(--ink-dim); opacity: 0.7; }
        /* Join prompt turns into a confirmation once this side is picked. */
        .half-join {
            margin-top: 24px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
            font-weight: 700; color: var(--accent); transition: opacity 0.25s;
        }
        .rsgo-half.selected .half-join { visibility: hidden; }
        .rsgo-half.selected .half-inner::after {
            content: '\2713  You\2019 re in'; display: block; margin-top: 24px;
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
            color: var(--accent);
        }

        /* Start button, centered on the seam. When enabled it's the ONE place the
           brand orange fully takes over — a solid pill that reads as THE action. */
        .rsgo-split-start {
            position: absolute; top: 76%; left: 50%; transform: translate(-50%, -50%);
            z-index: 5; height: 58px; padding: 0 40px; cursor: url("models/rsgo-cursor.png") 16 16, pointer;
            border-radius: 999px; border: none;
            font-family: inherit; display: inline-flex; align-items: center;
            transition: transform 0.16s ease, box-shadow 0.25s ease, background 0.2s ease, opacity 0.2s;
        }
        .rsgo-split-start span {
            display: inline-flex; align-items: center;
            font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
        }
        .rsgo-split-start .lbl-navy { margin-right: 8px; }
        /* Enabled: solid orange fill, navy text, soft orange halo + gentle pulse. */
        .rsgo-split-start:not(:disabled) {
            background: var(--orange); color: var(--navy-deep);
            box-shadow: 0 10px 30px -6px rgba(239,78,35,0.55);
            animation: rsgoStartPulse 2.2s ease-in-out infinite;
        }
        .rsgo-split-start:not(:disabled) .lbl-navy,
        .rsgo-split-start:not(:disabled) .lbl-orange { color: var(--navy-deep); }
        @keyframes rsgoStartPulse {
            0%,100% { box-shadow: 0 10px 30px -6px rgba(239,78,35,0.45); }
            50%     { box-shadow: 0 10px 40px -2px rgba(239,78,35,0.75); }
        }
        .rsgo-split-start:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 14px 40px -4px rgba(239,78,35,0.7);
        }
        .rsgo-split-start:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.98); }
        /* Disabled: hollow ghost pill — dim outline, muted text, no pulse. */
        .rsgo-split-start:disabled {
            cursor: url("models/rsgo-cursor.png") 16 16, default;
            background: transparent; border: 1.5px solid var(--line);
            box-shadow: none; opacity: 0.65;
        }
        .rsgo-split-start:disabled .lbl-navy,
        .rsgo-split-start:disabled .lbl-orange { color: var(--ink-dim); }

        /* A full team half: dimmed, not-allowed cursor, shows a FULL badge. */
        .rsgo-half.full {
            cursor: not-allowed; filter: brightness(0.42) saturate(0.5);
        }
        .rsgo-half.full:hover { filter: brightness(0.42) saturate(0.5); }
        .rsgo-half.full .half-ghost { opacity: 0.05; }
        .rsgo-half.full .half-join { visibility: hidden; }
        .rsgo-half.full .half-inner::after {
            content: 'Team full'; display: block; margin-top: 24px;
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
            color: var(--ink-dim);
        }

        /* Small transient popup ("team is full") on the team screen. */
        .rsgo-toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.94);
            z-index: 20; padding: 14px 26px; border-radius: 999px;
            background: var(--navy-deep); border: 1.5px solid var(--orange);
            color: var(--ink); font-size: 14px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
            box-shadow: 0 12px 40px -6px rgba(0,0,0,0.5), 0 0 24px -6px rgba(239,78,35,0.5);
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .rsgo-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>
    <!-- STEP 1 — Name entry -->
    <div id="nameScreen" class="rsgo-screen">
        <script>
            // Show only outside map-builder mode; the new flow shows it itself.
            if (!window.isMapBuilderMode) document.currentScript.parentElement.classList.add('show');
        </script>
        <div class="rsgo-card rsgo-name-card">
            <!-- Minimal: wordmark with a breathing orange dot, then the input. -->
            <div class="rsgo-brand rsgo-rise d1">
                <span class="rsgo-brand-word">RSGO<span class="rsgo-brand-dot">.</span></span>
            </div>

            <!-- Underline input + inline arrow. -->
            <div class="rsgo-namefield rsgo-rise d2">
                <input type="text" id="playerName" class="rsgo-underline-input" placeholder="enter your name" maxlength="16" autocomplete="off" spellcheck="false">
                <button id="joinGame" class="rsgo-arrow" aria-label="Continue">→</button>
            </div>
        </div>
    </div>

    <!-- STEP 2 — Connecting / loading (minimalist) -->
    <div id="loadingScreen" class="rsgo-screen">
        <div class="rsgo-card rsgo-load-card">
            <div class="rsgo-wordmark">RSGO</div>
            <div class="rsgo-loadbar"><span class="rsgo-loadbar-fill"></span></div>
            <div class="rsgo-hint" id="loadingHint">connecting</div>
            <!-- hidden, kept so runJoinLoader()'s querySelectorAll doesn't break -->
            <ul id="loadingSteps" style="display:none;">
                <li data-step="connect"></li><li data-step="arena"></li><li data-step="ready"></li>
            </ul>
        </div>
    </div>

    <!-- Mode select kept (hidden) so legacy JS hooks still resolve; flow skips it -->
    <div id="mapSelectionScreen" style="display: none;">
        <div id="deathmatchButton" style="display:none;"></div>
        <div id="teamVsTeamButton" style="display:none;"></div>
    </div>

    <!-- STEP 3 — Team selection: full-bleed vertical split, each side its own color -->
    <div id="teamSelectionScreen" class="rsgo-screen rsgo-split">
        <!-- Tiny prompt centered over the seam -->
        <div class="rsgo-split-prompt">Choose your side</div>

        <!-- LEFT half = ORANGE team (warm orange energy) -->
        <div class="rsgo-half team-orange" data-team="orange" id="joinOrangeTeam">
            <span class="half-ghost">01</span>
            <div class="half-inner">
                <div class="half-name">ORANGE</div>
                <div class="half-roster" id="orangeTeamSlots"></div>
                <div class="half-join">Click to join →</div>
            </div>
        </div>

        <!-- RIGHT half = NAVY team (internal id 'red'), cool steel energy -->
        <div class="rsgo-half team-navy" data-team="navy" id="joinRedTeam">
            <span class="half-ghost">02</span>
            <div class="half-inner">
                <div class="half-name">NAVY</div>
                <div class="half-roster" id="redTeamSlots"></div>
                <div class="half-join">← Click to join</div>
            </div>
        </div>

        <!-- Start button straddling the seam. -->
        <button id="startTeamGame" class="rsgo-split-start" disabled>
            <span class="lbl-navy">Start</span>
            <span class="lbl-orange">match</span>
        </button>
        <!-- Status text is kept (hidden) so existing JS that writes to it doesn't error. -->
        <span id="teamStatus" style="display:none;"></span>
    </div>

    <div id="gameContainer">
        <script>
            document.currentScript.parentElement.style.display = window.isMapBuilderMode ? 'block' : 'none';
        </script>
        <div id="ui">
            <div class="ui-panel">
                Players: <span id="playerCount" class="ui-value">0</span>
            </div>
            <div class="ui-panel">
                You: <span id="yourName" class="ui-value">Player</span>
            </div>
        </div>
        <div id="crosshair"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Make THREE global for compatibility -->
    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;
    </script>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
