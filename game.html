<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSGO - Multiplayer FPS</title>
    <link rel="icon" type="image/png" href="models/logo.png">
    <link rel="apple-touch-icon" href="models/logo.png">

    <!-- Self-hosted Umami analytics (same as the landing page) so the game can fire
         custom events (match-started, match-finished). Replace data-website-id. -->
    <script defer src="/analytics/script.js"
            data-website-id="REPLACE_WITH_UMAMI_WEBSITE_ID"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        function checkMapBuilderMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const mapBuilder = urlParams.get('mapbuilder');
            const hash = window.location.hash;
            
            return mapBuilder === 'orange' || hash === '#mapbuilder' || window.location.pathname.includes('mapbuilder');
        }

        window.isMapBuilderMode = checkMapBuilderMode();
        
        if (window.isMapBuilderMode) {
            console.log('🗺️ Map Builder Mode Detected - Hiding UI!');
        }
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            /* logo cursor (32x32 png), hotspot centred at 16,16 — same as website */
            cursor: url("models/rsgo-cursor.png") 16 16, crosshair;
        }
        a, button, [role="button"], input {
            cursor: url("models/rsgo-cursor.png") 16 16, pointer;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: none; /* Hide the player count UI */
        }
        .ui-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            min-width: 120px;
        }
        .ui-value {
            color: #00ff88;
            font-size: 16px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* RSGO logo reticle as the crosshair (same asset as the site cursor) */
            width: 16px;
            height: 16px;
            background: url("models/rsgo-cursor.png") center / contain no-repeat;
            pointer-events: none;
            z-index: 100;
        }
        
        #deathmatchButton:hover {
            background: #3a6b42 !important;
            border-color: #5db96a !important;
            transform: translateY(-2px);
        }

        #teamVsTeamButton:hover {
            background: #ff7b45 !important;
            border-color: #ff8c32 !important;
            transform: translateY(-2px);
        }

        /* ===== RSGO onboarding flow — NAVY-dominant, orange as a sparing accent ===
           Text/inputs/borders use a light "ink" tone so the orange cursor stays
           clearly visible; orange is reserved for the primary CTA + focus accents. */
        :root {
            --navy:       #1a2447;   /* base background */
            --navy-deep:  #131a36;   /* deeper panel navy */
            --navy-soft:  #232f57;   /* raised surfaces / input fields */
            --orange:     #ef4e23;   /* accent only */
            --ink:        #e8edff;   /* primary light text */
            --ink-dim:    #9fb0d8;   /* secondary / muted text */
            --line:       rgba(159,176,216,0.22); /* subtle borders */
        }
        /* Navy gradient background, LIGHT text by default. */
        .rsgo-screen {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            display: none; align-items: center; justify-content: center;
            z-index: 1000;
            background: radial-gradient(120% 120% at 50% 0%, var(--navy) 0%, var(--navy-deep) 100%);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .rsgo-screen.show { display: flex; animation: rsgoFade 0.5s ease both; }
        .rsgo-screen.leaving { animation: rsgoFadeOut 0.4s ease both; }
        @keyframes rsgoFade   { from { opacity: 0; } to { opacity: 1; } }
        @keyframes rsgoFadeOut{ from { opacity: 1; } to { opacity: 0; } }
        @keyframes rsgoRise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .rsgo-card { width: min(92vw, 780px); padding: 8px; }
        .rsgo-rise { animation: rsgoRise 0.5s ease both; }
        .rsgo-rise.d1 { animation-delay: 0.05s; }
        .rsgo-rise.d2 { animation-delay: 0.14s; }
        .rsgo-rise.d3 { animation-delay: 0.24s; }

        .rsgo-kicker {
            font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
            color: var(--orange); font-weight: 600; margin-bottom: 10px;
        }
        .rsgo-title { font-size: clamp(28px, 5vw, 46px); font-weight: 700; line-height: 1.05; margin: 0 0 6px; color: var(--ink); }
        .rsgo-sub   { color: var(--ink-dim); font-size: 15px; margin-bottom: 30px; }

        /* Input: soft navy field, subtle border, light text — orange only on focus. */
        .rsgo-input {
            width: 100%; box-sizing: border-box; padding: 16px 18px;
            background: var(--navy-soft);
            border: 1.5px solid var(--line);
            border-radius: 12px; color: var(--ink); font-size: 18px; font-family: inherit;
            outline: none; transition: box-shadow 0.2s, border-color 0.2s;
        }
        .rsgo-input::placeholder { color: var(--ink-dim); opacity: 0.6; }
        .rsgo-input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(239, 78, 35, 0.18); }

        /* Primary button: ORANGE fill, NAVY text. */
        .rsgo-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 30px; border: 2px solid var(--orange); border-radius: 12px;
            background: var(--orange); color: var(--navy); font-family: inherit;
            font-size: 16px; font-weight: 700; cursor: url("models/rsgo-cursor.png") 16 16, pointer;
            transition: transform 0.15s ease, background 0.2s, color 0.2s;
        }
        .rsgo-btn:hover  { transform: translateY(-2px); }
        .rsgo-btn:active { transform: translateY(0); }
        /* Disabled: hollow — navy fill, orange outline/text. */
        .rsgo-btn:disabled { background: var(--navy); color: var(--orange); opacity: 0.5; cursor: url("models/rsgo-cursor.png") 16 16, default; transform: none; }

        /* ===== Minimalist name + loader ===== */
        .rsgo-name-card, .rsgo-load-card {
            width: min(90vw, 480px); text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Small spaced wordmark, the only chrome. */
        .rsgo-wordmark {
            font-size: 13px; font-weight: 700; letter-spacing: 8px;
            color: var(--ink-dim); opacity: 0.8; margin-bottom: 48px;
            padding-left: 8px; /* visually balance the letter-spacing */
        }
        /* Logo image used in place of the wordmark on the name screen. */
        .rsgo-logo-mark { width: 64px; height: 64px; object-fit: contain; margin-bottom: 40px; }
        /* Underline-only input — no box. Big, clean, centered. */
        .rsgo-namefield {
            display: flex; align-items: center; gap: 14px;
            width: 100%; border-bottom: 2px solid var(--line);
            padding-bottom: 12px; transition: border-color 0.25s;
        }
        .rsgo-namefield:focus-within { border-color: var(--orange); }
        .rsgo-underline-input {
            flex: 1; background: none; border: none; outline: none;
            color: var(--ink); font-family: inherit; font-weight: 500;
            font-size: clamp(24px, 5vw, 38px); letter-spacing: 0.5px;
        }
        .rsgo-underline-input::placeholder { color: var(--ink-dim); opacity: 0.5; font-weight: 400; }
        /* Inline circular arrow submit. */
        .rsgo-arrow {
            flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
            border: 1.5px solid var(--line); background: var(--navy-soft); color: var(--ink-dim);
            font-size: 22px; font-weight: 700; cursor: url("models/rsgo-cursor.png") 16 16, pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.5; transform: scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease, background 0.25s, color 0.25s, border-color 0.25s;
        }
        /* Arrow activates once a name is typed (JS toggles .ready): orange ring +
           orange glyph on navy, so it stands out without an orange fill. */
        .rsgo-arrow.ready {
            opacity: 1; transform: scale(1);
            border-color: var(--orange); color: var(--orange); background: var(--navy-soft);
        }
        .rsgo-arrow.ready:hover { transform: scale(1.1); background: rgba(239,78,35,0.12); }

        .rsgo-hint {
            margin-top: 20px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--ink-dim); opacity: 0.6;
        }

        /* Thin minimalist loading bar (indeterminate sweep). */
        .rsgo-load-card .rsgo-wordmark { margin-bottom: 34px; }
        .rsgo-loadbar {
            width: 220px; height: 2px; background: rgba(159,176,216,0.18);
            border-radius: 2px; overflow: hidden; position: relative;
        }
        .rsgo-loadbar-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 40%;
            background: var(--orange); border-radius: 2px;
            animation: rsgoSweep 1.1s ease-in-out infinite;
        }
        @keyframes rsgoSweep {
            0%   { left: -40%; } 100% { left: 100%; }
        }
        .rsgo-load-card .rsgo-hint { margin-top: 22px; }

        /* Loader: orange ring on navy. */
        .rsgo-loader-ring {
            width: 64px; height: 64px; margin: 0 auto 28px;
            border: 3px solid rgba(239, 78, 35, 0.25);
            border-top-color: var(--orange); border-radius: 50%;
            animation: rsgoSpin 0.9s linear infinite;
        }
        @keyframes rsgoSpin { to { transform: rotate(360deg); } }
        .rsgo-steps { list-style: none; padding: 0; margin: 24px auto 0; max-width: 320px; text-align: left; }
        .rsgo-steps li {
            display: flex; align-items: center; gap: 12px; padding: 9px 0;
            color: var(--ink-dim); opacity: 0.5; font-size: 15px; transition: opacity 0.3s;
        }
        .rsgo-steps li .dot {
            width: 9px; height: 9px; border-radius: 50%;
            border: 1.5px solid var(--ink-dim); background: transparent; transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .rsgo-steps li.done   { opacity: 0.85; color: var(--ink); }
        .rsgo-steps li.done .dot { background: var(--orange); border-color: var(--orange); }
        .rsgo-steps li.active { opacity: 1; color: var(--ink); }
        .rsgo-steps li.active .dot { background: var(--orange); border-color: var(--orange); animation: rsgoPulse 0.9s ease infinite; }
        @keyframes rsgoPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,78,35,0.6);} 50% { box-shadow: 0 0 0 6px rgba(239,78,35,0);} }

        /* ===== Team select: navy-dominant split, each team an ACCENT color =====
           Both halves are navy (so the orange cursor stays visible everywhere); the
           teams are told apart by a colored accent — orange for one, steel-blue for
           the other — on the name, top bar, and roster chips. */
        .rsgo-split { padding: 0; align-items: stretch; }     /* halves fill the screen */
        .rsgo-half {
            flex: 1; display: flex; align-items: center; justify-content: center;
            cursor: url("models/rsgo-cursor.png") 16 16, pointer; position: relative;
            transition: filter 0.2s ease, background 0.25s ease;
            color: var(--ink);
        }
        /* Both halves navy; a subtle accent-tinted gradient hints the team color. */
        .navy-half   { --accent: #ef4e23; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); }
        .orange-half { --accent: #5b7bb4; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); }
        /* A thin accent bar along the top edge of each half = team identity. */
        .rsgo-half::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent);
        }
        /* The center seam line. */
        .navy-half::after {
            content: ''; position: absolute; top: 12%; bottom: 12%; right: 0; width: 1px;
            background: var(--line);
        }

        /* Hover/selected feedback. Halves stay 50/50 so the seam never moves. */
        .rsgo-half:hover { background: linear-gradient(180deg, var(--navy-soft) 0%, var(--navy) 100%); }
        .rsgo-split.has-pick .rsgo-half:not(.selected) { filter: brightness(0.7); }
        .rsgo-half.selected .half-inner {
            outline: 2px solid var(--accent); outline-offset: 18px; border-radius: 14px;
        }

        .half-inner { width: 80%; max-width: 360px; text-align: center; }
        .half-name {
            font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: 4px;
            margin-bottom: 22px; color: var(--accent);
        }
        .half-roster { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
        /* Player chips: soft navy surface, accent-colored left edge + light text. */
        .roster-chip {
            font-size: 15px; font-weight: 600; padding: 10px 14px; border-radius: 10px;
            animation: rsgoRise 0.35s ease both;
            background: var(--navy-soft); color: var(--ink);
            border-left: 3px solid var(--accent);
        }
        .roster-chip.you::after { content: ' (you)'; font-weight: 400; color: var(--ink-dim); }
        .half-empty { font-size: 14px; padding: 10px; font-weight: 500; color: var(--ink-dim); }
        .half-join {
            margin-top: 22px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
            font-weight: 700; color: var(--accent);
        }
        .rsgo-half.selected .half-join { visibility: hidden; }

        /* Start button straddling the seam. Built from two SOLID half-panels (no
           gradient, no transparency) so neither half can blend with the
           background behind it — the navy half stays pure navy, the orange half
           pure orange, regardless of what's underneath. */
        .rsgo-split-start {
            position: absolute; top: 72%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3; width: 260px; height: 60px; padding: 0; cursor: url("models/rsgo-cursor.png") 16 16, pointer;
            border: none; background: none; border-radius: 12px; overflow: hidden;
            isolation: isolate; /* own stacking context — nothing composites through */
            font-family: inherit; transition: transform 0.15s ease;
            display: flex;
        }
        .rsgo-split-start span {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
        }
        /* Navy pill with an ORANGE outline + orange text — contrasts cleanly and
           keeps the orange cursor visible (no full-orange fill). One unified button. */
        .rsgo-split-start {
            border: 1.5px solid var(--orange);
            background: var(--navy-deep);
            box-shadow: 0 6px 22px rgba(0,0,0,0.35);
        }
        .rsgo-split-start .lbl-navy,
        .rsgo-split-start .lbl-orange { background: transparent; color: var(--orange); }
        .rsgo-split-start:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.06);
            background: rgba(239,78,35,0.12); box-shadow: 0 8px 28px rgba(239,78,35,0.25);
        }
        /* Disabled: muted navy surface + dim border/text so it reads as not-ready. */
        .rsgo-split-start:disabled { cursor: url("models/rsgo-cursor.png") 16 16, default; border-color: var(--line); background: var(--navy-soft); }
        .rsgo-split-start:disabled .lbl-navy,
        .rsgo-split-start:disabled .lbl-orange { color: var(--ink-dim); }
    </style>
</head>
<body>
    <!-- STEP 1 — Name entry -->
    <div id="nameScreen" class="rsgo-screen">
        <script>
            // Show only outside map-builder mode; the new flow shows it itself.
            if (!window.isMapBuilderMode) document.currentScript.parentElement.classList.add('show');
        </script>
        <div class="rsgo-card rsgo-name-card">
            <!-- Just the input + arrow — fully minimal, no header. -->
            <div class="rsgo-namefield rsgo-rise d1">
                <input type="text" id="playerName" class="rsgo-underline-input" placeholder="enter your name" maxlength="16" autocomplete="off" spellcheck="false">
                <button id="joinGame" class="rsgo-arrow" aria-label="Continue">→</button>
            </div>
        </div>
    </div>

    <!-- STEP 2 — Connecting / loading (minimalist) -->
    <div id="loadingScreen" class="rsgo-screen">
        <div class="rsgo-card rsgo-load-card">
            <div class="rsgo-wordmark">RSGO</div>
            <div class="rsgo-loadbar"><span class="rsgo-loadbar-fill"></span></div>
            <div class="rsgo-hint" id="loadingHint">connecting</div>
            <!-- hidden, kept so runJoinLoader()'s querySelectorAll doesn't break -->
            <ul id="loadingSteps" style="display:none;">
                <li data-step="connect"></li><li data-step="arena"></li><li data-step="ready"></li>
            </ul>
        </div>
    </div>

    <!-- Mode select kept (hidden) so legacy JS hooks still resolve; flow skips it -->
    <div id="mapSelectionScreen" style="display: none;">
        <div id="deathmatchButton" style="display:none;"></div>
        <div id="teamVsTeamButton" style="display:none;"></div>
    </div>

    <!-- STEP 3 — Team selection: full-bleed vertical split (navy | orange) -->
    <div id="teamSelectionScreen" class="rsgo-screen rsgo-split">
        <!-- LEFT half = ORANGE team, on a NAVY background -->
        <div class="rsgo-half navy-half" data-team="orange" id="joinOrangeTeam">
            <div class="half-inner">
                <div class="half-name">ORANGE</div>
                <div class="half-roster" id="orangeTeamSlots"></div>
                <div class="half-join">Click to join →</div>
            </div>
        </div>

        <!-- RIGHT half = NAVY team (internal id 'red'), on an ORANGE background -->
        <div class="rsgo-half orange-half" data-team="navy" id="joinRedTeam">
            <div class="half-inner">
                <div class="half-name">NAVY</div>
                <div class="half-roster" id="redTeamSlots"></div>
                <div class="half-join">← Click to join</div>
            </div>
        </div>

        <!-- Start button straddling the seam: "Start" centered in left half,
             "match" centered in right half. -->
        <button id="startTeamGame" class="rsgo-split-start" disabled>
            <span class="lbl-navy">Start</span>
            <span class="lbl-orange">match</span>
        </button>
        <!-- Status text is kept (hidden) so existing JS that writes to it doesn't error. -->
        <span id="teamStatus" style="display:none;"></span>
    </div>

    <div id="gameContainer">
        <script>
            document.currentScript.parentElement.style.display = window.isMapBuilderMode ? 'block' : 'none';
        </script>
        <div id="ui">
            <div class="ui-panel">
                Players: <span id="playerCount" class="ui-value">0</span>
            </div>
            <div class="ui-panel">
                You: <span id="yourName" class="ui-value">Player</span>
            </div>
        </div>
        <div id="crosshair"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Make THREE global for compatibility -->
    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;
    </script>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
