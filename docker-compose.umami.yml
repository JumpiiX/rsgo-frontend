services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: rsgo-umami
    restart: unless-stopped
    environment:
      # Secrets come from the environment (deploy-umami.sh generates them into
      # umami.env and exports them). Defaults keep it runnable if set manually.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Served at the ROOT of its own subdomain (analytics.rsgo.io) via Caddy,
      # so no BASE_PATH — avoids the subpath routing issues.
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - rsgo-shared-network

  umami-db:
    image: postgres:16-alpine
    container_name: rsgo-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rsgo-shared-network

volumes:
  umami-db-data:

networks:
  rsgo-shared-network:
    external: true
