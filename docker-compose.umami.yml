# Self-hosted Umami analytics for rsgo.io — runs alongside the existing
# frontend/backend/caddy containers on the shared docker network.
#
# Served under a SUBPATH: https://rsgo.io/analytics  (BASE_PATH=/analytics).
# Caddy forwards /analytics* -> umami:3000 (see the Caddyfile block).
#
# DON'T run this directly — use `bash deploy-umami.sh`, which generates the
# secrets (UMAMI_DB_PASSWORD / UMAMI_APP_SECRET into umami.env), exports them,
# brings this up, and reloads Caddy. Re-running is safe (the DB volume persists).
#
# Then: open https://rsgo.io/analytics, log in (default admin / umami — CHANGE IT),
# add a website for "rsgo.io", copy its website-id into index.html's tracking tag.

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: rsgo-umami
    restart: unless-stopped
    environment:
      # Secrets come from the environment (deploy-umami.sh generates them into
      # umami.env and exports them). Defaults keep it runnable if set manually.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Serve the app under /analytics (so Caddy can proxy rsgo.io/analytics).
      BASE_PATH: /analytics
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - rsgo-shared-network

  umami-db:
    image: postgres:16-alpine
    container_name: rsgo-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rsgo-shared-network

volumes:
  umami-db-data:

networks:
  rsgo-shared-network:
    external: true
